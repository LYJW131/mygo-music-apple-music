name: Release

# Pushing a tag v<version> releases that commit: it has to be on main and the
# version has to be plugin.json's. The release carries the zip MyGo Music
# installs, and the app offers it as an update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The checks, and the plugin played on every platform it ships for.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag is plugin.json's version, on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(jq -r .version plugin.json)"
          if [[ "$TAG" != "$version" ]]; then
            echo "The tag is $TAG but plugin.json says $version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$TAG isn't on main" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # amhelper, the lossless helper, is Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code
      - name: Check the zip
        working-directory: dist/release
        run: sha256sum --check ./*.sha256
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # GitHub's notes list the pull requests merged since the last release.
        # A release of commits pushed straight to main has none, and said
        # nothing of what changed: its notes are then those commits, each
        # with what it says of itself.
        run: |
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" ${prev:+-f previous_tag_name="$prev"} -q .body > notes.md
          if ! grep -q "^## What's Changed" notes.md; then
            {
              echo "## What's Changed"
              echo
              git log --no-merges --reverse --format=%H "${prev:+$prev..}$TAG" | while read -r commit; do
                subject=$(git log -1 --format=%s "$commit")
                [[ "$subject" == "chore(release)"* ]] && continue
                echo "* $subject"
                git log -1 --format=%b "$commit" | sed -E '/^(Co-Authored-By|Signed-off-by):/d' | sed 's/^/  /' | sed -e 's/[[:space:]]*$//' | cat -s
              done
              echo
              cat notes.md
            } > changed.md
            mv changed.md notes.md
          fi
          gh release create "$TAG" dist/release/*.zip dist/release/*.sha256 --verify-tag --notes-file notes.md --title "$TAG"
